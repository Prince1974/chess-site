# ============================================================
# Masterchessis — Configuration de déploiement Netlify
# ============================================================

[build]
  command = "echo 'Build static site'"
  publish = "."

[[redirects]]
  from = "/api/*"
  to = "https://masterchessis.onrender.com/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://unpkg.com https://cdn.socket.io https://accounts.google.com https://apis.google.com https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.peerjs.com wss://*.peerjs.com https://cdn.socket.io https://masterchessis.onrender.com wss://masterchessis.onrender.com https://accounts.google.com https://www.google-analytics.com https://region1.google-analytics.com; font-src 'self' data:; frame-src https://accounts.google.com;"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
