# ============================================================
# Masterchessis — Configuration de déploiement Netlify
# ============================================================

[build]
  command = "npm install && npm run build"
  publish = "."

# Redirection SPA : toutes les routes → index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# En-têtes pour le Worker/WASM Stockfish (Cross-Origin isolation)
[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"

# MIME types spécifiques pour WASM si nécessaire
[[headers]]
  for = "/vendor/stockfish/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"

[[headers]]
  for = "/vendor/stockfish/*.js"
  [headers.values]
    Content-Type = "application/javascript"
